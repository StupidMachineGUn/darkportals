services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: darkportals
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: darkportals
    volumes:
      - pgdata:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darkportals"]
      interval: 5s
      retries: 10
  game:
    image: darkportals:${VERSION:-latest}
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://darkportals:${DB_PASSWORD}@db:5432/darkportals
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8080
      ADMINS: ${ADMINS:-}
      CF: ${CF:-0}
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    depends_on: [game]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
volumes: { pgdata: {}, caddy_data: {}, caddy_config: {} }
